<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Corte de Caja - Hotel Sys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Menú Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">🏨 Hotel Sys</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Panel Principal</a></li>
                    <li class="nav-item"><a class="nav-link text-warning" href="/facturacion">Facturación</a></li>
                    <li class="nav-item"><span class="nav-link text-info ms-3">Hola, {{ session['nombre'] }}</span></li>
                    <li class="nav-item"><a class="nav-link text-danger fw-bold" href="/logout">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-success">
                    <div class="card-header bg-success text-white text-center">
                        <h4 class="mb-0">Cierre de Turno</h4>
                    </div>
                    <div class="card-body text-center p-4">
                        <h6 class="text-muted mb-4">Usuario responsable: <strong>{{ session['nombre'] }}</strong></h6>
                        
                        <div class="alert alert-light border shadow-sm py-4 mb-4">
                            <p class="mb-1 text-secondary">Ingresos calculados del día de hoy:</p>
                            <h2 class="text-success fw-bold">{{ total_hoy }} Bs</h2>
                        </div>

                        <form action="/corte_caja" method="POST">
                            <input type="hidden" name="monto_calculado" value="{{ total_hoy }}">
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">Confirmar y Guardar Corte</button>
                                <a href="/" class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
