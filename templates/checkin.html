<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Check-in - Habitación {{ numero_habitacion }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Registro de Ingreso - Habitación N° {{ numero_habitacion }}</h4>
                    </div>
                    <div class="card-body">
                        <form action="/checkin/{{ numero_habitacion }}" method="POST">
                            
                            <h5 class="mb-3 text-success border-bottom pb-2">Datos del Huésped</h5>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" name="nombre" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Apellido</label>
                                    <input type="text" name="apellido" class="form-control" required>
                                </div>
                            </div>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Cédula de Identidad (CI)</label>
                                    <input type="text" name="ci" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono</label>
                                    <input type="text" name="telefono" class="form-control">
                                </div>
                            </div>

                            <h5 class="mb-3 text-secondary border-bottom pb-2">Datos del Vehículo (Opcional)</h5>
                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <label class="form-label">Placa</label>
                                    <input type="text" name="placa" class="form-control" placeholder="Ej: 1234ABC">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Marca/Modelo</label>
                                    <input type="text" name="marca" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Categoría</label>
                                    <select name="cat_vehiculo" class="form-select">
                                        <option value="">Ninguno</option>
                                        <option value="Pequeño/Mediano">Pequeño/Mediano (5 Bs)</option>
                                        <option value="Grande">Grande (10 Bs)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="/" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Confirmar Ingreso</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
