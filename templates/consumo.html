<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargar Consumo - Hab. {{ numero_habitacion }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-primary">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Cargar Consumo - Habitación {{ numero_habitacion }}</h5>
                    </div>
                    <div class="card-body">
                        <form action="/consumo/{{ numero_habitacion }}" method="POST">
                            
                            <div class="mb-3">
                                <label class="form-label">Seleccionar Producto</label>
                                <select name="id_producto" class="form-select" required>
                                    <option value="">-- Elige un producto --</option>
                                    {% for prod in productos %}
                                        <option value="{{ prod.id_producto }}">{{ prod.nombre_producto }} - {{ prod.precio_venta }} Bs</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Cantidad</label>
                                <input type="number" name="cantidad" class="form-control" min="1" value="1" required>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="/" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Agregar a la Cuenta</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
